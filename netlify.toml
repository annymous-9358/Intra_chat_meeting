[build]
  publish = "public"
  command = "echo 'static site + functions, nothing to build'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The service worker must always be fresh so app updates reach everyone
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
