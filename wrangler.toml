# Cloudflare Workers deployment (free plan): https://app.intrachat.workers.dev
name = "app"
main = "worker/index.mjs"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# The web app (public/) is packed into the Worker at build time and served by it
[build]
command = "node worker/build-assets.mjs"
watch_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "intra-chat"
database_id = "c668e1b4-debf-4a7b-8662-040dc8e6976f"

# Run the Worker next to the database (D1's primary is in Hong Kong): each query takes a few ms instead of 50–200
# Photos, voice notes and uploaded sounds
[[r2_buckets]]
binding = "FILES"
bucket_name = "intra-chat-files"

[placement]
region = "gcp:asia-east2"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
