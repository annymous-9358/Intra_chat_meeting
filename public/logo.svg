  <rect x="166" y="232" width="30" height="58" rx="15" fill="#00a884"/>
  <rect x="212" y="210" width="30" height="102" rx="15" fill="#00a884"/>
  <rect x="258" y="240" width="30" height="42" rx="15" fill="#00a884"/>
  <!-- radio waves (walkie-talkie) -->
  <path d="M360 96a96 96 0 0 1 64 64" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" opacity=".95"/>
  <path d="M352 50a150 150 0 0 1 116 116" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" opacity=".55"/>
</svg>
