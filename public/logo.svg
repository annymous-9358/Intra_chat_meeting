<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Intra Chat">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25d0a0"/>
      <stop offset="1" stop-color="#007a63"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6fff6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#g)"/>
  <!-- chat bubble -->
  <path d="M120 150h214c32 0 58 26 58 58v104c0 32-26 58-58 58H232l-74 58c-9 7-21 0-19-11l9-47h-28c-32 0-58-26-58-58V208c0-32 26-58 58-58z" fill="url(#s)"/>
