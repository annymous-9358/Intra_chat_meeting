name: Tests

# Unit tests, a Cloudflare Worker build check, and the browser tests against the LAN server — on every push
# (except changes that only touch the Android app) and on demand from the Actions tab.
on:
  push:
    paths-ignore: ['mobile/**', '**.md']
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Cloudflare Worker builds
        run: npx wrangler deploy --dry-run --outdir dist

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: test/e2e/.out/*.png, if-no-files-found: ignore }
